<script>
(function () {
  'use strict';

  /* ---------- cuenta regresiva ---------- */
  var TARGET = new Date('2026-10-30T19:00:00-05:00').getTime();
  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var box = document.getElementById('countdown');
  var elD = document.getElementById('d');
  var elH = document.getElementById('h');
  var elM = document.getElementById('m');

  function tick() {
    var diff = TARGET - Date.now();
    if (diff <= 0) {
      box.querySelector('.label').textContent = '¡Hoy es el día!';
      box.querySelector('.clock').style.display = 'none';
      clearInterval(timer);
      return;
    }
    var totalMin = Math.floor(diff / 60000);
    elD.textContent = Math.floor(totalMin / 1440);
    elH.textContent = pad(Math.floor((totalMin % 1440) / 60));
    elM.textContent = pad(totalMin % 60);
  }
  var timer = setInterval(tick, 30000);
  tick();

  /* ---------- aviso flotante ---------- */
  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }

  /* ---------- agregar al calendario (.ics) ---------- */
  var ICS = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Karen Bravo//Invitacion//ES',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:cumple-karen-bravo-2026@invitacion',
    'DTSTAMP:20261026T120000Z',
    'DTSTART:20261031T000000Z',
    'DTEND:20261031T040000Z',
    'SUMMARY:Cumpleaños de Karen Bravo',
    'LOCATION:Casa de Yamit',
    'DESCRIPTION:Viernes 30 de octubre\\, 7:00 p. m. Confirma por WhatsApp al 313 633 2887.',
    'BEGIN:VALARM',
    'TRIGGER:-P1D',
    'ACTION:DISPLAY',
    'DESCRIPTION:Mañana es el cumpleaños de Karen',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  document.getElementById('ics').addEventListener('click', function () {
    var blob = new Blob([ICS], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'cumple-karen-bravo.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    showToast('Evento listo para guardar');
  });

  /* ---------- copiar enlace ---------- */
  function copyLink() {
    var link = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(
        function () { showToast('Enlace copiado'); },
        function () { fallbackCopy(link); }
      );
    } else {
      fallbackCopy(link);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('Enlace copiado'); }
    catch (e) { showToast(text); }
    document.body.removeChild(ta);
  }
  document.getElementById('share').addEventListener('click', function (e) {
    e.preventDefault();
    if (navigator.share) {
      navigator.share({
        title: 'Cumpleaños de Karen Bravo',
        text: 'Viernes 30 de octubre, 7:00 p. m. · Casa de Yamit',
        url: location.href
      }).catch(function () {});
    } else {
      copyLink();
    }
  });
})();
